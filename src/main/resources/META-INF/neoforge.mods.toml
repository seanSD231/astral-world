modLoader = "javafml"
loaderVersion = "[4,)"
license = "All Rights Reserved"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
description = '''The Astral World dimension for a Lord of the Mysteries server.'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neo_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "lotm"
type = "optional"
versionRange = "[2.5,)"
ordering = "AFTER"
side = "BOTH"

# Loaded after Numismatics so this mod's resources win: the three unused coins are redrawn and renamed
# as amethyst, emerald and diamond (assets/numismatics/).
[[dependencies.${mod_id}]]
modId = "numismatics"
type = "optional"
versionRange = "[1.0,)"
ordering = "AFTER"
side = "BOTH"
