name: Build mod
on:
  push:
  workflow_dispatch:
permissions:
  contents: write          # needed to publish the jar as a release asset
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: astral_world-jar
          path: build/libs/*.jar

      # The launcher fetches the mod from a release asset. Actions artifacts need a
      # login and expire, so they are no use for that. Publish the jar that was just
      # built -- never a rebuild, because Gradle jars embed timestamps and a second
      # build of the same commit hashes differently.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          jar=$(ls build/libs/*.jar | grep -v -- '-sources\.jar$' | head -1)
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v already released; skipping"
            exit 0
          fi
          echo "releasing v$v from $jar"
          gh release create "v$v" "$jar" \
            --title "v$v" \
            --notes "Automated build of \`${GITHUB_SHA::7}\`."
          echo "sha1 $(sha1sum "$jar" | cut -d' ' -f1)"
