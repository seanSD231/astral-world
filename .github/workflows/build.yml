name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Build
        shell: bash
        run: |
          set +e
          gradle build --no-daemon 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            grep -E "error:" -A2 build.log | head -40 | while IFS= read -r l; do echo "::error::${l}"; done
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        with:
          name: astral_world-jar
          path: build/libs/*.jar
